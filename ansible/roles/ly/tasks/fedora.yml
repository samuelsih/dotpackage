---
- name: Install ly and prerequisites
  become: true
  ansible.builtin.dnf:
    name:
      - ly
      - xorg-x11-xauth
      - xorg-x11-server-Xorg
      - brightnessctl
    state: present

- name: Disable getty on the ly TTY (takes effect at reboot)
  become: true
  ansible.builtin.systemd:
    name: getty@tty2.service
    enabled: false

- name: Enable ly
  become: true
  ansible.builtin.systemd:
    name: ly@tty2.service
    enabled: true

- name: Copy ly SELinux policy module
  become: true
  ansible.builtin.copy:
    src: ly-local.pp
    dest: /etc/selinux/local/ly-local.pp
    mode: "0644"
  when: (ansible_facts['selinux']['status'] | default('disabled')) in ['enforcing', 'permissive']

- name: Check if the ly SELinux policy module is loaded
  become: true
  ansible.builtin.command:
    cmd: semodule -l
  register: semodule_list
  changed_when: false
  when: (ansible_facts['selinux']['status'] | default('disabled')) in ['enforcing', 'permissive']

- name: Load ly SELinux policy module
  become: true
  ansible.builtin.command:
    cmd: semodule -i /etc/selinux/local/ly-local.pp
  when:
    - (ansible_facts['selinux']['status'] | default('disabled')) in ['enforcing', 'permissive']
    - '"ly-local" not in semodule_list.stdout'
