---
- name: Setup system
  hosts: all

  pre_tasks:
    - name: Update package cache
      ansible.builtin.import_tasks: pre_tasks/update-package-cache.yaml
      
    - name: Add sudo user
      ansible.builtin.import_tasks: pre_tasks/add-sudo-user.yaml
      
    - name: Create .config directory
      ansible.builtin.import_tasks: pre_tasks/create-config-directory.yaml

  roles:
    - packages
    - fonts